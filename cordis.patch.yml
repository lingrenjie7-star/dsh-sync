# ============================================================================
# 跨电脑同步 的 bundle patch —— 把插件挂进 DSH 配置树
# ============================================================================
#
# 【这是什么】
#   这是本插件的"挂载声明"。DSH 启动时按 bundle 层栈把各个插件的 patch
#   叠起来组成配置树。本文件就是这一层的内容。
#
# 【工作原理】
#   - insert：往配置树里添加插件行（entry）
#   - id 必须全局唯一且与包名一致，否则商城预检会判 SUBMISSION_ENTRY_MISSING
#   - name: 'dsh-dntb' 解析包入口 lib/index.js（宿主半边）
#   - 因为 package.json 声明了 dsh.client，DSH 同时会把本包扫描为
#     "浏览器插件"，向页面提供 /plugins/dsh-dntb/client.js
#
# 【注意】
#   下面 id 那一行不能写行尾注释——预检用正则抓值，带注释会抓不到。
#
# ============================================================================

- insert:
    - id: dsh-dntb
      name: 'dsh-dntb'
